<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSONPlaceholder - Posts</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <div>
      <p class="eyebrow">API REST · JSONPLACEHOLDER</p>
      <h1>Publicaciones</h1>
      <p class="subtitle">Haz clic en una tarjeta para consultar los datos completos del usuario.</p>
    </div>
  </header>

  <main class="container">
    <div id="status" class="status">Cargando publicaciones...</div>
    <section id="postsContainer" class="grid" aria-live="polite"></section>
  </main>

  <div id="userModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-backdrop" data-close="true"></div>
    <div class="modal-card">
      <button id="closeModal" class="close" aria-label="Cerrar">×</button>
      <div class="modal-head">
        <div class="avatar" id="avatar">U</div>
        <div>
          <p class="eyebrow">INFORMACIÓN DEL USUARIO</p>
          <h2 id="modalTitle">Usuario</h2>
        </div>
      </div>
      <div id="userDetails" class="details"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
